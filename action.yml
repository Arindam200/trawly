name: trawly
description: Scan dependency lockfiles and SBOMs with trawly.
inputs:
  path:
    description: Project directory to scan.
    required: false
    default: "."
  fail-on:
    description: Severity threshold for failing the job.
    required: false
    default: "high"
  config:
    description: Optional trawly.toml path.
    required: false
    default: ""
  baseline:
    description: Optional trawly baseline file.
    required: false
    default: ""
  sarif-output:
    description: SARIF output path.
    required: false
    default: "trawly.sarif"
  markdown-output:
    description: Markdown output path.
    required: false
    default: "trawly.md"
  upload-sarif:
    description: Upload SARIF to GitHub code scanning.
    required: false
    default: "true"
  env-scan:
    description: Scan committed .env files for secret-like values.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 20
    - name: Build trawly
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build
    - name: Resolve output paths
      id: output-paths
      shell: bash
      run: |
        sarif_output="${{ inputs.sarif-output }}"
        markdown_output="${{ inputs.markdown-output }}"
        if [[ "$sarif_output" != /* ]]; then
          sarif_output="$GITHUB_WORKSPACE/$sarif_output"
        fi
        if [[ "$markdown_output" != /* ]]; then
          markdown_output="$GITHUB_WORKSPACE/$markdown_output"
        fi
        echo "sarif=$sarif_output" >> "$GITHUB_OUTPUT"
        echo "markdown=$markdown_output" >> "$GITHUB_OUTPUT"
    - name: Run trawly
      shell: bash
      run: |
        set +e
        args=(scan "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}")
        if [[ "${{ inputs.env-scan }}" == "true" ]]; then
          args+=(--env)
        else
          args+=(--no-env)
        fi
        if [[ -n "${{ inputs.config }}" ]]; then
          args+=(--config "${{ inputs.config }}")
        fi
        if [[ -n "${{ inputs.baseline }}" ]]; then
          args+=(--baseline "${{ inputs.baseline }}")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" --format sarif --output "${{ steps.output-paths.outputs.sarif }}"
        status=$?
        inspect_args=(inspect "${{ inputs.path }}")
        if [[ "${{ inputs.env-scan }}" == "true" ]]; then
          inspect_args+=(--env)
        else
          inspect_args+=(--no-env)
        fi
        if [[ -n "${{ inputs.config }}" ]]; then
          inspect_args+=(--config "${{ inputs.config }}")
        fi
        if [[ -n "${{ inputs.baseline }}" ]]; then
          inspect_args+=(--baseline "${{ inputs.baseline }}")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${inspect_args[@]}" --format markdown --output "${{ steps.output-paths.outputs.markdown }}" || true
        echo "$status" > "$RUNNER_TEMP/trawly-exit-code"
        exit 0
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.output-paths.outputs.sarif }}
        category: trawly
    - name: Preserve trawly exit code
      shell: bash
      run: exit "$(cat "$RUNNER_TEMP/trawly-exit-code")"
